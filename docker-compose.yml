services:
  trading-desk-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-desk-v2
    restart: unless-stopped
    ports:
      # External QNAP host port 5095 mapped to internal container port 8000
      - "5095:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      # Absolute path on QNAP host mapped to the container data directory
      - /share/Container/trading_deskV2/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"